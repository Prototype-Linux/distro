name: Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13
      options: --privileged
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            schroot \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-efi \
            grub-efi-amd64-bin \
            grub-pc-bin \
            grub-common \
            mtools \
            dosfstools \
            zstd \
            eatmydata \
            wget \
            gnupg

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('lb-config/**') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Cache live-build packages
        uses: actions/cache@v4
        with:
          path: cache/packages.binary
          key: lb-cache-${{ runner.os }}-${{ hashFiles('lb-config/**') }}
          restore-keys: |
            lb-cache-${{ runner.os }}-

      - name: Configure build
        run: |
          chmod +x lb-config/lb_config_prototype.sh
          ./lb-config/lb_config_prototype.sh

      - name: Run lb build
        run: eatmydata lb build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Prototype-amd64.hybrid.iso
          path: "*.iso"
          if-no-files-found: warn
          retention-days: 90
          archive: false